name: Build AdaptGenoPred Executables

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install pyinstaller scikit-learn xgboost scikit-allel
        pip install numpy pandas scipy matplotlib dask

    - name: Build binary
      run: >
        pyinstaller --onefile
        --collect-all allel
        --collect-all dask
        --collect-all xgboost
        --copy-metadata numpy
        --copy-metadata scipy
        --copy-metadata pandas
        --copy-metadata scikit-learn
        --copy-metadata xgboost
        --copy-metadata scikit-allel
        --name AdaptGenoPred-${{ runner.os }}
        adaptive_ensemble_pipeline.py

    - name: Package as tar.gz
      run: |
        cd dist
        tar -czf AdaptGenoPred-${{ runner.os }}.tar.gz AdaptGenoPred-${{ runner.os }}*

    - name: Create Release if not exists
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release view ${{ github.ref_name }} --repo ${{ github.repository }} || \
        gh release create ${{ github.ref_name }} --repo ${{ github.repository }} --title "${{ github.ref_name }}" --notes "Auto-built binaries"

    - name: Upload to GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ github.ref_name }} \
          dist/AdaptGenoPred-${{ runner.os }}.tar.gz \
          --repo ${{ github.repository }} --clobber
