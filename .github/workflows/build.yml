name: Build AdaptGenoPred Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Restore source files from secrets
      run: |
        echo "${{ secrets.ADAPTIVE_PIPELINE_PY }}" | base64 --decode > adaptive_ensemble_pipeline.py
        echo "${{ secrets.GWAS_ML_HYBRID_PY }}" | base64 --decode > gwas_ml_hybrid.py

    - name: Install dependencies
      run: |
        pip install pyinstaller scikit-learn xgboost scikit-allel
        pip install numpy pandas scipy matplotlib dask

    - name: Build AdaptGenoPred binary
      run: >
        pyinstaller --onefile
        --collect-all allel
        --collect-all dask
        --collect-all xgboost
        --copy-metadata numpy
        --copy-metadata scipy
        --copy-metadata pandas
        --copy-metadata scikit-learn
        --copy-metadata xgboost
        --copy-metadata scikit-allel
        --name AdaptGenoPred-${{ runner.os }}
        adaptive_ensemble_pipeline.py

    - name: Build GWASml binary
      run: >
        pyinstaller --onefile
        --collect-all allel
        --collect-all dask
        --collect-all xgboost
        --copy-metadata numpy
        --copy-metadata scipy
        --copy-metadata pandas
        --copy-metadata scikit-learn
        --copy-metadata xgboost
        --copy-metadata scikit-allel
        --name GWASml-${{ runner.os }}
        gwas_ml_hybrid.py

    - name: Package binaries
      run: |
        cd dist
        tar -czf AdaptGenoPred-${{ runner.os }}.tar.gz AdaptGenoPred-${{ runner.os }}*
        tar -czf GWASml-${{ runner.os }}.tar.gz GWASml-${{ runner.os }}*

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/AdaptGenoPred-${{ runner.os }}.tar.gz
          dist/GWASml-${{ runner.os }}.tar.gz
        fail_on_unmatched_files: true
